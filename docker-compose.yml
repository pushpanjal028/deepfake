version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veritas-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/uploads
      - model_data:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - MODEL_PATH=${MODEL_PATH:-./models/efficientnet_b4.pth}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - veritas-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veritas-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veritas-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: veritas-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - veritas-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: veritas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - veritas-network
    restart: unless-stopped

volumes:
  uploads_data:
  model_data:
  redis_data:
  mongo_data:

networks:
  veritas-network:
    driver: bridge
